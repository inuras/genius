<title>Tableau du pinyin</title>

<style>
/* Layout: one-screen app. Title + tone bar on top, the chart scrolls in both directions
   with sticky initials/finals, a player docked at the bottom. Tone colours carry the identity. */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --ink: #18202b;
  --muted: #5f6b7a;
  --line: #d9dfe6;
  --faint: #aeb8c4;
  --hover: #e6ebf1;
  --sel: #18202b;
  --sel-ink: #ffffff;
  --t1: #d3302a; --t2: #d97008; --t3: #23914a; --t4: #2463c4; --t0: #8b95a3;
  --t1-soft: #fbe7e5; --t2-soft: #fcefdc; --t3-soft: #e1f3e6; --t4-soft: #e2ebfa;
  --f-display: "Noto Serif", Georgia, "Times New Roman", serif;
  --f-ui: "Noto Sans", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-han: "Noto Serif SC", "Songti SC", "SimSun", "Noto Sans CJK SC", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151b; --surface: #1a2029; --ink: #e9edf2; --muted: #9aa5b3; --line: #2b3440; --faint: #46515f;
    --hover: #232b36; --sel: #e9edf2; --sel-ink: #11151b;
    --t1: #ff7a70; --t2: #ffad54; --t3: #5fd38a; --t4: #74a8ff; --t0: #8d97a6;
    --t1-soft: #3a1f1e; --t2-soft: #3a2b17; --t3-soft: #18331f; --t4-soft: #1b2a45;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151b; --surface: #1a2029; --ink: #e9edf2; --muted: #9aa5b3; --line: #2b3440; --faint: #46515f;
  --hover: #232b36; --sel: #e9edf2; --sel-ink: #11151b;
  --t1: #ff7a70; --t2: #ffad54; --t3: #5fd38a; --t4: #74a8ff; --t0: #8d97a6;
  --t1-soft: #3a1f1e; --t2-soft: #3a2b17; --t3-soft: #18331f; --t4-soft: #1b2a45;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px;
  display: flex; flex-direction: column; overflow: hidden;
}
.top {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 10px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
  border-bottom: 1px solid var(--line); background: var(--surface);
}
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { font-family: var(--f-display); font-size: 21px; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
.brand .han { font-family: var(--f-han); font-size: 19px; color: var(--muted); }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-left: auto; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg); }
.seg button {
  font: 600 14px var(--f-ui); color: var(--muted); background: transparent; border: 0;
  padding: 7px 11px; min-width: 40px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
}
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--sel); color: var(--sel-ink); }
.seg button .dot { width: 8px; height: 8px; border-radius: 50%; }
.search { position: relative; }
.search input {
  font: 15px var(--f-ui); color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  border-radius: 10px; padding: 7px 10px; width: 150px;
}
.search input:focus-visible, button:focus-visible { outline: 2px solid var(--t4); outline-offset: 2px; }

.chartwrap { flex: 1; min-height: 0; overflow: auto; position: relative; -webkit-overflow-scrolling: touch; }
table { border-collapse: separate; border-spacing: 0; font-variant-numeric: tabular-nums; }
th, td { padding: 0; }
thead th {
  position: sticky; top: 0; z-index: 2; background: var(--surface);
  font: 600 13px var(--f-ui); color: var(--muted); height: 30px; min-width: 54px;
  border-bottom: 1px solid var(--line);
}
thead tr.groups th { height: 20px; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; border-bottom: 0; top: 0; }
thead tr.inits th { top: 20px; font-size: 15px; color: var(--ink); }
thead tr.groups th.g { border-left: 1px solid var(--line); text-align: left; padding-left: 6px; }
th.corner { left: 0; z-index: 3; min-width: 64px; }
tbody th {
  position: sticky; left: 0; z-index: 1; background: var(--surface); text-align: left;
  font: 600 14px var(--f-ui); padding: 0 8px; border-right: 1px solid var(--line); white-space: nowrap;
}
tbody th small { font-weight: 400; color: var(--muted); font-size: 11px; margin-left: 3px; }
tbody tr.gstart th, tbody tr.gstart td { border-top: 2px solid var(--line); }
td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); text-align: center; height: 40px; }
td.gl { border-left: 1px solid var(--line); }
td button {
  width: 100%; height: 100%; min-height: 40px; border: 0; background: transparent; cursor: pointer;
  font: 500 15px var(--f-ui); color: var(--ink); padding: 0 4px; white-space: nowrap;
}
td button:hover { background: var(--hover); }
td button.on { background: var(--sel); color: var(--sel-ink); }
td button.no { color: var(--faint); cursor: default; }
td button.no:hover { background: transparent; }
td button.t1 { color: var(--t1); } td button.t2 { color: var(--t2); }
td button.t3 { color: var(--t3); } td button.t4 { color: var(--t4); }
td button.on.t1, td button.on.t2, td button.on.t3, td button.on.t4 { color: var(--sel-ink); }
td button.flash { animation: flash .6s ease-out; }
@keyframes flash { from { box-shadow: inset 0 0 0 3px var(--t4); } to { box-shadow: inset 0 0 0 0 transparent; } }

.player {
  border-top: 1px solid var(--line); background: var(--surface);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px max(12px, env(safe-area-inset-bottom, 0px));
  display: grid; grid-template-columns: minmax(0, auto) minmax(0, 1fr); gap: 6px 18px; align-items: center;
}
.big { font-family: var(--f-display); font-size: 44px; font-weight: 700; line-height: 1; min-width: 3.2ch; }
.tonebtns { display: flex; flex-wrap: wrap; gap: 6px; }
.tb {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--bg);
  border-radius: 10px; padding: 6px 10px 6px 8px; cursor: pointer; font: 600 17px var(--f-ui); color: var(--ink);
}
.tb svg { width: 22px; height: 22px; flex: none; }
.tb.t1 { color: var(--t1); background: var(--t1-soft); border-color: transparent; }
.tb.t2 { color: var(--t2); background: var(--t2-soft); border-color: transparent; }
.tb.t3 { color: var(--t3); background: var(--t3-soft); border-color: transparent; }
.tb.t4 { color: var(--t4); background: var(--t4-soft); border-color: transparent; }
.tb[disabled] { color: var(--t0); background: transparent; border-color: var(--line); border-style: dashed; cursor: default; opacity: .7; }
.tb.all { color: var(--ink); background: var(--bg); border-color: var(--line); font-size: 14px; }
.tb.playing { box-shadow: 0 0 0 2px currentColor; }
.info { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 14px; color: var(--muted); min-width: 0; }
.info .ex { color: var(--ink); }
.exb { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 3px 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.exb:hover { background: var(--hover); }
.exb .pl { font-size: 11px; color: var(--t4); }
.info .ex .h { font-family: var(--f-han); font-size: 17px; }
.info .tip b { color: var(--ink); }
.credit { grid-column: 1 / -1; margin: 2px 0 0; font-size: 11px; color: var(--muted); }
.credit a { color: inherit; }
.legend { font-size: 12px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.legend svg { width: 18px; height: 14px; }
@media (max-width: 560px) {
  .brand h1 { font-size: 18px; }
  .tools { margin-left: 0; width: 100%; }
  .search input { width: 120px; }
  .big { font-size: 36px; }
  .tb { font-size: 16px; padding: 5px 8px 5px 6px; }
  .legend { display: none; }
}
@media (prefers-reduced-motion: reduce) { td button.flash { animation: none; } }

/* ---------- iPhone / touch screens ---------- */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { -webkit-tap-highlight-color: transparent; }
/* Below 16px, iPhone zooms the whole page when the search box is tapped. */
.search input { font-size: 16px; }
/* Keep the chart clear of the notch in landscape (full-screen view). */
.chartwrap { margin-left: env(safe-area-inset-left, 0px); }
.exs { display: contents; }
.embedded .brand { display: none; }
details.credit summary { cursor: pointer; list-style: none; display: inline; }
details.credit summary::-webkit-details-marker { display: none; }
details.credit summary::after { content: " ▾"; }
details.credit[open] summary::after { content: " ▴"; }
@media (hover: none) {
  td button:not(.on):hover { background: transparent; }
  .exb:hover { background: var(--bg); }
}
td button:active:not(.no) { background: var(--hover); }
.tb:active, .exb:active { transform: scale(.97); }

/* Phones in portrait: compact header and player so the chart keeps most of the screen. */
@media (max-width: 560px) {
  .top { padding-block: 8px; gap: 8px; }
  .brand h1 { font-size: 17px; }
  .brand .han { font-size: 15px; }
  .tools { flex-wrap: nowrap; gap: 6px; }
  .seg { flex: none; }
  .seg button { padding: 8px 9px; min-width: 0; min-height: 40px; }
  .search { flex: 1 1 auto; min-width: 0; }
  .search input { width: 100%; min-height: 40px; padding: 7px 9px; }
  .player { padding-block: 8px max(8px, env(safe-area-inset-bottom, 0px)); gap: 6px 10px; }
  .big { font-size: 30px; min-width: 2.4ch; }
  .tonebtns { gap: 5px; }
  .tb { font-size: 15px; padding: 5px 7px 5px 5px; gap: 3px; min-height: 40px; }
  .tb svg { width: 16px; height: 16px; }
  .info { flex-direction: column; flex-wrap: nowrap; gap: 6px; font-size: 13px; }
  .exs {
    display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
    margin: 0 -16px; padding: 0 16px; -webkit-overflow-scrolling: touch;
  }
  .exs::-webkit-scrollbar { display: none; }
  .exb { flex: none; white-space: nowrap; min-height: 36px; }
  .credit { font-size: 11px; }
}
@media (max-width: 340px) {
  .tools { flex-wrap: wrap; }
  .search { flex-basis: 100%; }
}

/* Phones in landscape: chart on the left, player on the right. */
@media (max-height: 500px) and (min-width: 561px) {
  body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(250px, 34%); grid-template-rows: auto minmax(0, 1fr); }
  .top { grid-column: 1 / -1; padding-block: 6px; gap: 6px 12px; }
  .legend { display: none; }
  .brand h1 { font-size: 17px; }
  .brand .han { font-size: 15px; }
  .search input { width: 130px; }
  .chartwrap { grid-column: 1; grid-row: 2; }
  .player {
    grid-column: 2; grid-row: 2; border-top: 0; border-left: 1px solid var(--line);
    overflow-y: auto; align-content: start; grid-template-columns: minmax(0, 1fr);
    padding-block: 10px max(10px, env(safe-area-inset-bottom, 0px)); padding-left: 12px;
  }
  .big { font-size: 32px; }
  .tb { font-size: 15px; padding: 4px 8px 4px 6px; min-height: 38px; }
  .tb svg { width: 16px; height: 16px; }
  .info { flex-direction: column; flex-wrap: nowrap; font-size: 13px; }
  .exs { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  .exb { display: block; text-align: left; }
  .exb .h { white-space: nowrap; }
}
</style>

const audioUrl = tok => "audio/" + (tok.startsWith("w:")
  ? "w-" + Array.from(tok.slice(2), c => c.codePointAt(0).toString(16)).join("-")
  : tok) + ".mp3";

const CONTOUR = { 1: "M3 4 L19 4", 2: "M3 12 L19 3", 3: "M3 8 Q10 25 19 5", 4: "M3 3 L19 18" };
const CHAO = { 1: "55", 2: "35", 3: "214", 4: "51" };
const TONE_NAME = { 1: "haut et plat", 2: "montant", 3: "bas", 4: "descendant" };
const glyph = t => `<svg viewBox="0 0 22 22" aria-hidden="true"><path d="${CONTOUR[t]}" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

let mode = 0;          // 0 = all four tones in order, 1-4 = that tone only
let current = null;    // key "ini|fin"
let ctx = null, playToken = 0;
const buffers = new Map();

// ---------- audio ----------
async function getBuffer(tok) {
  if (buffers.has(tok)) return buffers.get(tok);
  const p = fetch(audioUrl(tok))
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.arrayBuffer(); })
    .then(buf => ctx.decodeAudioData(buf));
  p.catch(() => buffers.delete(tok)); // allow a retry after a network error
  buffers.set(tok, p);
  return p;
}
function playOne(tok) {
  return new Promise(async resolve => {
    if (!AUDIO_KEYS.has(tok)) return resolve();
    try {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === "suspended") await ctx.resume();
      const buf = await getBuffer(tok);
      const src = ctx.createBufferSource(); src.buffer = buf; src.connect(ctx.destination);
      src.onended = resolve; src.start();
    } catch (e) {
      const a = new Audio(audioUrl(tok));
      a.onended = resolve; a.onerror = resolve; a.play().catch(resolve);
    }
  });
}
async function playSeq(base, tones) {
  const my = ++playToken;
  for (const t of tones) {
    if (my !== playToken) return;
    markPlaying(t);
    await playOne(base + t);
    await new Promise(r => setTimeout(r, 180));
  }
  if (my === playToken) markPlaying(null);
}
function markPlaying(t) {
  document.querySelectorAll(".tb[data-t]").forEach(b => b.classList.toggle("playing", +b.dataset.t === t));
}

// ---------- chart ----------
const table = document.getElementById("chart");
function buildChart() {
  const ini = DATA.initials;
  let h = '<thead><tr class="groups"><th class="corner"></th>';
  for (const g of DATA.groups) h += `<th class="g" colspan="${g.span}">${g.label}</th>`;
  h += '</tr><tr class="inits"><th class="corner" scope="col">finale</th>';
  for (const i of ini) h += `<th scope="col">${i || "∅"}</th>`;
  h += "</tr></thead><tbody>";
  const groupStarts = new Set(DATA.groups.map(g => g.start));
  for (const f of DATA.finals) {
    h += `<tr class="${DATA.finalGroupStarts.includes(f.key) ? "gstart" : ""}"><th scope="row">${f.label}${f.note ? `<small>${f.note}</small>` : ""}</th>`;
    ini.forEach((i, ci) => {
      const key = i + "|" + f.key;
      const c = DATA.cells[key];
      const gl = groupStarts.has(ci) ? ' class="gl"' : "";
      h += c ? `<td${gl}><button type="button" data-k="${key}">${c.w}</button></td>` : `<td${gl}></td>`;
    });
    h += "</tr>";
  }
  table.innerHTML = h + "</tbody>";
}
function paintChart() {
  table.querySelectorAll("button[data-k]").forEach(b => {
    const c = DATA.cells[b.dataset.k];
    b.className = "";
    if (mode === 0) { b.textContent = c.w; }
    else if (c.m[mode]) { b.textContent = c.m[mode]; b.classList.add("t" + mode); }
    else { b.textContent = c.w; b.classList.add("no"); }
    if (b.dataset.k === current) b.classList.add("on");
  });
}

// ---------- player ----------
function select(key, play) {
  current = key;
  const c = DATA.cells[key];
  paintChart();
  const big = document.getElementById("big");
  const shownTone = mode && c.m[mode] ? mode : 0;
  big.textContent = shownTone ? c.m[shownTone] : c.w;
  big.style.color = shownTone ? `var(--t${shownTone})` : "";
  let tb = "";
  for (const t of [1, 2, 3, 4]) {
    tb += c.m[t]
      ? `<button type="button" class="tb t${t}" data-t="${t}" aria-label="${c.m[t]}, ton ${t} (${TONE_NAME[t]})">${glyph(t)}${c.m[t]}</button>`
      : `<button type="button" class="tb" data-t="${t}" disabled title="Ce ton n'existe pas pour ${c.w}">${glyph(t)}<span style="text-decoration:line-through">${c.w}</span></button>`;
  }
  tb += `<button type="button" class="tb all" id="playAll">▶ 1→4</button>`;
  document.getElementById("tonebtns").innerHTML = tb;
  let info = "";
  const ex = DATA.examples[c.b] || [];
  if (ex.length) info += '<div class="exs">' + ex.slice(0, 3).map(e => e.a
    ? `<button type="button" class="ex exb" data-a="${e.a}" aria-label="Écouter ${e.h}"><span class="pl">▶</span><span class="h" lang="zh">${e.h}</span> ${e.p} · ${e.f}</button>`
    : `<span class="ex"><span class="h" lang="zh">${e.h}</span> ${e.p} · ${e.f}</span>`).join("") + "</div>";
  if (c.tip) info += `<span class="tip">${c.tip}</span>`;
  const missing = [1, 2, 3, 4].filter(t => !c.m[t]);
  if (missing.length && !ex.length && !c.tip) info += `<span>Tons absents : ${missing.join(", ")}</span>`;
  document.getElementById("info").innerHTML = info;
  if (play) {
    const tones = mode ? (c.m[mode] ? [mode] : []) : [1, 2, 3, 4].filter(t => c.m[t]);
    playSeq(c.b, tones);
  }
}

table.addEventListener("click", e => {
  const b = e.target.closest("button[data-k]");
  if (!b) return;
  const c = DATA.cells[b.dataset.k];
  if (mode && !c.m[mode]) { select(b.dataset.k, false); return; }
  select(b.dataset.k, true);
});
document.getElementById("info").addEventListener("click", e => {
  const b = e.target.closest("button[data-a]");
  if (!b) return;
  playToken++; markPlaying(null); playOne(b.dataset.a);
});
document.getElementById("tonebtns").addEventListener("click", e => {
  const c = DATA.cells[current];
  const b = e.target.closest("button");
  if (!b || b.disabled) return;
  if (b.id === "playAll") return playSeq(c.b, [1, 2, 3, 4].filter(t => c.m[t]));
  playSeq(c.b, [+b.dataset.t]);
});
document.getElementById("toneSeg").addEventListener("click", e => {
  const b = e.target.closest("button[data-tone]");
  if (!b) return;
  mode = +b.dataset.tone;
  document.querySelectorAll("#toneSeg button").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
  try { localStorage.setItem("pinyin-mode", String(mode)); } catch (err) {}
  select(current, false);
});

// ---------- search ----------
const MARKS = { "ā":"a","á":"a","ǎ":"a","à":"a","ē":"e","é":"e","ě":"e","è":"e","ī":"i","í":"i","ǐ":"i","ì":"i",
  "ō":"o","ó":"o","ǒ":"o","ò":"o","ū":"u","ú":"u","ǔ":"u","ù":"u","ǖ":"ü","ǘ":"ü","ǚ":"ü","ǜ":"ü" };
function norm(s) {
  return s.trim().toLowerCase().replace(/[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]/g, m => MARKS[m]).replace(/v/g, "ü").replace(/u:/g, "ü").replace(/[1-5\s]/g, "");
}
const byWritten = {};
for (const [k, c] of Object.entries(DATA.cells)) byWritten[c.w] = k;
function find(q) {
  const s = norm(q);
  if (!s) return null;
  if (byWritten[s]) return byWritten[s];
  if (byWritten[s.replace("ü", "u")]) return byWritten[s.replace("ü", "u")];
  return null;
}
const qInput = document.getElementById("q");
function reveal(key) {
  const b = table.querySelector(`button[data-k="${CSS.escape(key)}"]`);
  if (!b) return;
  // Scroll only the chart's own scroll area: scrollIntoView would also scroll the page
  // around the chart when it is embedded in an iframe.
  const wrap = document.getElementById("wrap");
  const br = b.getBoundingClientRect(), wr = wrap.getBoundingClientRect();
  wrap.scrollTo({
    top: wrap.scrollTop + (br.top - wr.top) - (wrap.clientHeight - br.height) / 2,
    left: wrap.scrollLeft + (br.left - wr.left) - (wrap.clientWidth - br.width) / 2,
    behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"
  });
  b.classList.remove("flash"); void b.offsetWidth; b.classList.add("flash");
}
qInput.addEventListener("input", () => {
  qInput.setCustomValidity("");
  const k = find(qInput.value);
  if (k) { select(k, false); reveal(k); }
});
document.getElementById("searchForm").addEventListener("submit", e => {
  e.preventDefault();
  const k = find(qInput.value);
  if (k) { select(k, true); reveal(k); qInput.blur(); }
  else { qInput.setCustomValidity("Cette syllabe n'existe pas en mandarin"); qInput.reportValidity(); }
});

// ---------- legend ----------
document.getElementById("legend").innerHTML = [1, 2, 3, 4]
  .map(t => `<span style="color:var(--t${t})">${glyph(t)}<b>${t}</b>&nbsp;${CHAO[t]}</span>`).join("");

// Credits are folded on small screens, open on big ones.
if (matchMedia("(min-width: 561px) and (min-height: 501px)").matches) document.querySelector("details.credit").open = true;

// ---------- start ----------
try { const m = +localStorage.getItem("pinyin-mode"); if (m >= 0 && m <= 4) mode = m; } catch (err) {}
document.querySelectorAll("#toneSeg button").forEach(x => x.setAttribute("aria-pressed", +x.dataset.tone === mode ? "true" : "false"));
buildChart();
select("m|a", false);
</script>
